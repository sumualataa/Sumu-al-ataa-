<style>
  :root {
    --green: #0d3126;
    --green-soft: #2a4a3f;
    --sand: #cfb894;
    --olive: #8c826a;
    --paper: #f5f6f1;
    --line: #dcd3c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "ZAIN", "Segoe UI", Tahoma, sans-serif;
    background: var(--paper);
    color: var(--green);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(32px, 6vw, 72px) 24px 24px;
    text-align: center;
  }

  .logo {
    direction: ltr;
    width: min(560px, 88vw);
    height: auto;
    display: block;
  }

  /* الخط الرملي يشبه الفاصل العامودي في الشعار، ويرتسم مرة وحدة عند تحميل الصفحة */
  .stem {
    width: 2px;
    height: clamp(40px, 8vh, 72px);
    background: var(--sand);
    margin: clamp(20px, 4vh, 36px) 0;
    transform-origin: top;
    animation: grow 1.1s cubic-bezier(.3,.7,.2,1) both;
  }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  h1 {
    font-family: "ZAIN", Tahoma, sans-serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.4rem);
    line-height: 1.3;
    color: var(--green);
  }

  .lead {
    margin-top: 18px;
    max-width: 30em;
    font-size: clamp(1.3rem, 3.2vw, 1.7rem);
    line-height: 1.7;
    color: var(--green-soft);
  }

  .en {
    margin-top: 28px;
    font-family: "Montserrat", Arial, sans-serif;
    font-weight: 500;
    font-size: .95rem;
    letter-spacing: .02em;
    color: var(--olive);
    direction: ltr;
  }

  footer {
    background: var(--green);
    color: var(--sand);
    text-align: center;
    padding: 18px 24px;
    font-size: .95rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .stem { animation: none; }
  }
</style>
</head>
